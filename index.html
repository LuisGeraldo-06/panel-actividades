<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Actividades</title>
</head>
<body>
    <h1>Mis tareas de hoy</h1>

<p>TE AMO CARLENY</p>

<!-- El formulario y sus campos -->
<form>
  <input type="text">
</form>

<br>
<br>
<!-- Cada campo con su etiqueta -->
<label for="titulo">Título de la tarea</label>
<input type="text" id="titulo">

<br>
<br>

<!-- Otros campos del panel -->

<label for="prioridad">Prioridad</label>
<select id="prioridad">
  <option>baja</option>
  <option>media</option>
  <option>alta</option>
</select>

<br>
<br>

<!-- Agrupar campos relacionados: fieldset y legend-->

<fieldset>
  <legend>Prioridad</legend>
  <label><input type="radio" name="prioridad"> Baja</label>
  <label><input type="radio" name="prioridad"> Alta</label>
</fieldset>

<br>
<br>
<!-- Atributos que ayudan al campo -->

<input type="text" id="titulo" required maxlength="80">

<br>
<br>

<script>
    console.log("Hola, Luis!");
</script>
    


</body>
</html>
